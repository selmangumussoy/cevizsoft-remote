name: CevizSoft Remote Android x86_64

on:
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: r27c
  FLUTTER_VERSION: 3.24.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang gcc g++ nasm yasm \
            pkg-config libssl-dev perl zip unzip \
            libgtk-3-dev libxcb-randr0-dev libxdo-dev \
            libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libpulse-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libopus-dev libsodium-dev libvpx-dev

      - name: Setup vcpkg classic
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg-classic
          /tmp/vcpkg-classic/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg-classic/vcpkg install --classic opus libvpx libyuv libsodium
          echo "VCPKG_ROOT=/tmp/vcpkg-classic" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "NDK_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build native library
        run: |
          cargo ndk -t x86_64 --platform 21 build --release --lib

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter pub get
        run: |
          cd flutter
          flutter pub get

      - name: Copy native lib
        run: |
          mkdir -p flutter/android/app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/release/librustdesk.so flutter/android/app/src/main/jniLibs/x86_64/

      - name: Build APK
        run: |
          cd flutter
          flutter build apk --release --target-platform android-x64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cevizsoft-remote-x86_64
          path: flutter/build/app/outputs/flutter-apk/*.apk
